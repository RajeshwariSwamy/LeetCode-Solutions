name: Sync All LeetCode Submissions and Create PR

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # 1. Fetch ALL LeetCode submissions into a temporary branch
      - name: Sync LeetCode All Submissions
        uses: AkashSingh3031/The-LeetCode-Bot@master
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}

      # 2. Open a Pull Request so you can review and merge them
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync all unique LeetCode submissions"
          title: "Code Sync: Multiple LeetCode Solutions Detected"
          body: "Automated PR containing your distinct LeetCode solution attempts."
          branch: leetcode-multi-updates
          base: main
